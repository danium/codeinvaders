name: Feature request
description: Propose a product or protocol improvement.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need without including private agent data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary area
      options: [Protocol, Adapter, Local runtime, Visualization, CLI, Documentation]
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Product constraints
      options:
        - label: The proposal preserves local-first, observational, privacy-allowlisted behavior.
          required: true
