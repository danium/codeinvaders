name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.27.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run complete repository gate
        run: pnpm check
      - name: Build and verify release artifacts
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: pnpm release:prepare -- --version=${RELEASE_VERSION#v}
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeinvaders-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
      - name: Attest release archive
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3
        with:
          subject-path: dist/release/codeinvaders-*.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease="--prerelease"
          if [ "$TAG" = "v1.0.0" ]; then prerelease=""; fi
          gh release create "$TAG" dist/release/* --verify-tag $prerelease --notes-file dist/release/RELEASE_NOTES.md
